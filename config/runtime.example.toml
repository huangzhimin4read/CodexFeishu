schema_version = 1
mode = "shadow"
retention_days = 30
command_ttl_seconds = 86400

[paths]
workspace_root = ".."
database = "../.runtime/bridge.sqlite3"
shadow_database = "../.runtime/shadow.sqlite3"
codex_home = "C:/Users/REPLACE_USER/.codex"
codex_executable = "C:/Users/REPLACE_USER/AppData/Roaming/npm/node_modules/@openai/codex/node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe"
schema_root = "../generated/codex/0.145.0"
status = "../.runtime/status.json"
backup_root = "../.runtime/backups"

[allowlist]
projects = ["C:/Projects/REPLACE_PROJECT"]
threads = ["REPLACE_THREAD_ID"]

[feishu]
tenant_key = "REPLACE_TENANT_KEY"
app_id = "REPLACE_APP_ID"
owner_open_id = "REPLACE_OWNER_OPEN_ID"
owner_display_name = "REPLACE_OWNER_DISPLAY_NAME"
# Optional: send Codex-authored user messages through official lark-cli UAT.
# Startup verifies only that the selected profile has a ready authorized user.
#user_message_identity = "lark_cli_user"
#lark_cli_profile = "REPLACE_LARK_CLI_PROFILE"
p2p_chat_id = "REPLACE_P2P_CHAT_ID"
# Optional parallel surface. Keep the P2P database/config unchanged while a
# private ordinary group with topic-form messages is being canaried.
#conversation_mode = "topic_group"
#topic_chat_id = "REPLACE_PRIVATE_TOPIC_GROUP_CHAT_ID"
credential_target = "CodexFeishu/REPLACE_APP_ID/app_secret"
endpoint_contract = "tenant-contract.example.json"

# For topic-group remote input, prefer [remote] delivery="cli". It submits
# through `codex exec resume`, including local images via `--image`, without
# depending on desktop focus or clipboard state.
