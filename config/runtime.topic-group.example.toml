schema_version = 1
mode = "outbound"
project_name = "REPLACE_PROJECT_DISPLAY_NAME"
retention_days = 30
command_ttl_seconds = 86400

[paths]
workspace_root = ".."
database = "../.runtime/topic-group.sqlite3"
shadow_database = "../.runtime/topic-group-shadow.sqlite3"
codex_home = "C:/Users/REPLACE_USER/.codex"
codex_executable = "C:/Users/REPLACE_USER/AppData/Roaming/npm/node_modules/@openai/codex/node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe"
schema_root = "../generated/codex/0.147.0-alpha.6.6"
status = "../.runtime/topic-group-status.json"
backup_root = "../.runtime/topic-group-backups"

[allowlist]
projects = ["C:/Projects/REPLACE_PROJECT"]
threads = ["REPLACE_THREAD_ID"]

[codex_projects]
enabled = false
activity_after_ms = 0
primary_project_id = ""

[remote]
enabled = false
text = false
images = false
files = false
approvals = false
controls = false
auto_approve = false
# "desktop" routes input through the Codex app's own writer and confirms the
# resulting user turn from newly appended rollout bytes. "app_server" is the
# isolated-worker compatibility mode.
delivery = "desktop"
max_image_bytes = 10485760
max_file_bytes = 26214400

# Required only for delivery="app_server". The scheduled task must run as a
# different, non-administrator Windows account. The worker may access selected
# Codex state/project roots, but not this bridge's .runtime directory or
# Windows Credential Manager secret.
#[worker_isolation]
#worker_sid = "S-1-5-21-REPLACE-WORKER-SID"
#scheduled_task_name = "CodexFeishu-Worker-Owner"
#launch_file = "../.runtime/isolated-worker-launch.json"
#worker_codex_home = "C:/Users/REPLACE_WORKER/.codex"

[feishu]
tenant_key = "REPLACE_TENANT_KEY"
app_id = "REPLACE_APP_ID"
owner_open_id = "REPLACE_OWNER_OPEN_ID"
p2p_chat_id = "REPLACE_FALLBACK_P2P_CHAT_ID"
conversation_mode = "topic_group"
topic_chat_id = "REPLACE_PRIVATE_TOPIC_GROUP_CHAT_ID"
credential_target = "CodexFeishu/REPLACE_APP_ID/app_secret"
endpoint_contract = "tenant-contract.topic-group.example.json"
