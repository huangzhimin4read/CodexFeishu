schema_version = 1
mode = "outbound"
project_name = "REPLACE_PROJECT_DISPLAY_NAME"
retention_days = 30
command_ttl_seconds = 86400

[paths]
workspace_root = ".."
database = "../.runtime/topic-group.sqlite3"
shadow_database = "../.runtime/topic-group-shadow.sqlite3"
codex_home = "C:/Users/REPLACE_USER/.codex"
codex_executable = "C:/Users/REPLACE_USER/AppData/Roaming/npm/node_modules/@openai/codex/node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe"
schema_root = "../generated/codex/0.147.0-alpha.6.6"
status = "../.runtime/topic-group-status.json"
backup_root = "../.runtime/topic-group-backups"

[allowlist]
projects = ["C:/Projects/REPLACE_PROJECT"]
threads = ["REPLACE_THREAD_ID"]

[codex_projects]
enabled = false
activity_after_ms = 0
primary_project_id = ""

[remote]
enabled = false
text = false
images = false
files = false
approvals = false
controls = false
auto_approve = false
# "cli" (recommended) persists text and images into the exact Codex task with
# `codex exec resume`, then confirms the new user turn from rollout bytes. If
# another writer owns the task, ingress stays durably queued for a later CLI
# retry. CLI mode never manipulates the Codex Desktop composer.
# "desktop_relay" submits only to one private Desktop relay task; that task
# forwards once to the real target through Desktop's cross-task tool. The relay
# task is excluded from discovery, topic creation, and all Feishu mirroring.
# Keep one non-minimized primary Codex window available for the relay and use
# other Codex windows for normal work. The bridge prefills that primary window
# through the local-task prompt deep link (whose pure deep-link path does not
# call show/focus), then invokes its Send control without global keyboard or
# clipboard input. Exact relay and target rollout items are both required.
# Set both relay identity fields only with that mode.
#desktop_relay_thread_id = "REPLACE_PRIVATE_RELAY_THREAD_ID"
#desktop_relay_thread_title = "飞书桥接专用中转"
# "desktop" is the direct UI-automation alternative. "app_server" is the
# isolated-worker compatibility mode.
delivery = "cli"
max_image_bytes = 10485760
max_file_bytes = 26214400

# Required only for delivery="app_server". The scheduled task must run as a
# different, non-administrator Windows account. The worker may access selected
# Codex state/project roots, but not this bridge's .runtime directory or
# Windows Credential Manager secret.
#[worker_isolation]
#worker_sid = "S-1-5-21-REPLACE-WORKER-SID"
#scheduled_task_name = "CodexFeishu-Worker-Owner"
#launch_file = "../.runtime/isolated-worker-launch.json"
#worker_codex_home = "C:/Users/REPLACE_WORKER/.codex"

[feishu]
tenant_key = "REPLACE_TENANT_KEY"
app_id = "REPLACE_APP_ID"
owner_open_id = "REPLACE_OWNER_OPEN_ID"
owner_display_name = "REPLACE_OWNER_DISPLAY_NAME"
# Optional: send Codex-authored user messages through official lark-cli UAT.
# Startup verifies that the profile's authorized user Open ID equals owner_open_id.
#user_message_identity = "lark_cli_user"
#lark_cli_profile = "REPLACE_LARK_CLI_PROFILE"
p2p_chat_id = "REPLACE_FALLBACK_P2P_CHAT_ID"
conversation_mode = "topic_group"
topic_chat_id = "REPLACE_PRIVATE_TOPIC_GROUP_CHAT_ID"
credential_target = "CodexFeishu/REPLACE_APP_ID/app_secret"
endpoint_contract = "tenant-contract.topic-group.example.json"
